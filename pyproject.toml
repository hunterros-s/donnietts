[project]
name = "donnietts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0,<1",
    "alembic>=1.16.0,<2",
    "fastapi>=0.116.0,<1",
    "httpx>=0.28.0,<1",
    "numpy>=2.0.0",
    "pyyaml>=6.0.3",
    "scipy>=1.14.0",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "sqlalchemy[asyncio]>=2.0.0,<3",
    "uvicorn[standard]>=0.35.0,<1",
]

[project.scripts]
donnietts = "donnietts.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.5.0,<3",
    "pytest>=8.4.0,<9",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "donnietts"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
