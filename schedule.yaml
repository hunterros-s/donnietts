version: 1
timezone: America/Detroit

defaults:
  lead_minutes: 5

announcements:
  - time: "08:00"
    template: >-
      Good morning. It is {time} on {weekday}, {date}.
      In {location}, the morning is {weather_condition} and {current_temp} degrees.
      The forecast high is {high_temp} degrees, the low is {low_temp} degrees, wind is {wind}, and precipitation chance is {precip_chance}.

  - time: "08:15"
    template: It is {time}.

  - time: "08:30"
    template: It is {time}.

  - time: "08:45"
    template: It is {time}.

  - time: "09:00"
