[project]
name = "qwen-speech-service"
version = "0.1.0"
description = "OpenAI-compatible HTTP speech service for Qwen TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0,<1",
    "numba>=0.65.1",
    "numpy>=2.4.6,<2.5",
    "qwen-tts>=0.1.1",
    "soundfile>=0.13.1",
    "torch>=2.12.0,<2.13",
    # torchaudio must be a DIRECT dependency: uv only honors the cpu-index
    # source pin below for direct deps. Resolving it transitively via qwen-tts
    # pulls the CUDA wheel from PyPI, which fails on machines without CUDA
    # (libcudart.so.N missing).
    "torchaudio>=2.11.0,<2.12",
    "uvicorn[standard]>=0.35.0,<1",
]

[project.scripts]
qwen-speech = "qwen_speech.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1",
    "openai>=2.0.0,<3",
    "pytest>=8.0.0,<10",
    "pytest-asyncio>=1.0.0,<2",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qwen_speech"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
