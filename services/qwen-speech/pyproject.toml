[project]
name = "qwen-speech-service"
version = "0.1.0"
description = "OpenAI-compatible HTTP speech service for Qwen TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0,<1",
    "uvicorn[standard]>=0.35.0,<1",
]

[project.scripts]
qwen-speech = "qwen_speech.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1",
    "openai>=2.0.0,<3",
    "pytest>=8.0.0,<10",
    "pytest-asyncio>=1.0.0,<2",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qwen_speech"

[tool.pytest.ini_options]
testpaths = ["tests"]
